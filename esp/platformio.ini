; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp12e

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
test_ignore = *

; Briefkasten fuer die Zitatliste: data/ bleibt normalerweise leer.
; Eine data/quotes.txt wird einmal ins FRAM uebernommen und ersetzt die Liste.
; Beispiel in data-beispiel/, hochladen mit pio run -t uploadfs
board_build.filesystem = littlefs

#OTA
#Xupload_protocol = espota
#upload_port = reflectionwall.local

#Serial
upload_protocol = esptool
monitor_speed = 74880
monitor_filters = esp8266_exception_decoder, time

lib_deps =
    tzapu/WiFiManager

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*>
build_flags = -std=gnu++14
